<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imo-ishora AI | Ikki tomonlama tarjimon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #00f2fe;
            --dark-bg: #0f172a;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .navbar {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(25px);
            padding: 1.2rem 3rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.4s;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: white;
            text-shadow: var(--neon-glow);
        }

        .main-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .avatar-container {
            position: relative;
            background: radial-gradient(circle at center, rgba(0, 210, 255, 0.05) 0%, transparent 70%);
            overflow: hidden;
            border-radius: 20px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--glass-border);
        }

        .avatar-glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border: 2px solid rgba(0, 210, 255, 0.15);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 210, 255, 0.2);
            animation: pulse-ring 4s infinite ease-in-out;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes pulse-ring {
            0% {
                width: 280px;
                height: 280px;
                opacity: 0.3;
            }

            50% {
                width: 340px;
                height: 340px;
                opacity: 0.1;
            }

            100% {
                width: 280px;
                height: 280px;
                opacity: 0.3;
            }
        }

        #hand3DContainer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a2a44 0%, #0f172a 100%);
            border-radius: 20px;
            position: relative;
        }

        .hero {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 4rem;
            margin-bottom: 3rem;
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .mode-selector {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .mode-btn {
            padding: 1.2rem 4rem;
            border-radius: 100px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.5s;
            background: var(--glass);
            color: white;
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
        }

        .translator-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 2.5rem;
            border: 1px solid var(--glass-border);
        }

        .video-container {
            position: relative;
            width: 100%;
            border-radius: 30px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
        }

        video,
        canvas {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 30px;
        }

        .translation-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            padding: 2rem;
            margin-top: 1.5rem;
        }

        .translation-text {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: var(--neon-glow);
            margin: 1rem 0;
        }

        .btn {
            padding: 1rem 2.5rem;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .thinking-dots {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        @media (max-width: 1024px) {
            .translator-grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" style="cursor: pointer;"
                onclick="document.querySelector('[data-nav=\'translate\']').click()">Imo-ishora AI</div>
            <div class="nav-links">
                <a href="#" class="active" data-nav="translate">Tarjimon</a>
                <a href="#" data-nav="library">Lug'at</a>
                <a href="#" data-nav="quiz">Test</a>
                <a href="#" id="openSettings">Sozlamalar</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="hero">
            <h1>Ikki tomonlama AI tarjimon</h1>
            <p>Imo-ishora tili ↔ O'zbek tili | Sun'iy intellekt asosida real vaqtda tarjima</p>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="deaf">Imo-ishora rejimi</button>
                <button class="mode-btn" data-mode="hearing">Ovozli rejim</button>
            </div>
        </div>

        <div id="deafMode" class="translator-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Imo-ishora kamerasi</div>
                </div>
                <div class="video-container">
                    <video id="deafVideo" autoplay playsinline muted></video>
                    <canvas id="deafCanvas"></canvas>
                </div>
                <div class="controls" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button class="btn btn-primary" id="startDeafCamera">▶ Boshlash</button>
                    <button class="btn btn-danger" id="stopDeafCamera">⏹ To'xtatish</button>
                </div>
                <div class="translation-panel">
                    <div class="translation-text" id="deafTranslation">...</div>
                    <div class="translation-desc" id="deafDescription">Imo-ishorani ko'rsating</div>
                    <button class="btn btn-primary" id="sendSignToSpeech" style="width: 100%; margin-top: 1rem;">📤
                        Yuborish (Gapirtirish)</button>
                    <div class="sign-display" id="deafSigns"></div>
                </div>
            </div>

            <div class="card" style="padding: 0; background: transparent; border: none;">
                <div class="avatar-container">
                    <div class="avatar-glow-ring"></div>
                    <div id="hand3DContainer"></div>
                </div>
                <div class="translation-panel" style="margin-top: 1.5rem; background: var(--glass);">
                    <div class="thinking-dots" id="aiThinking" style="display: none;">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <div class="translation-text" id="aiResponseText" style="font-size: 1.8rem;">Tayyorman! Harakatlarni
                        ko'rsating.</div>
                </div>
            </div>
        </div>

        <div id="hearingMode" class="translator-grid" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Ovozli kirish</div>
                </div>
                <div class="controls"><button class="btn btn-primary" id="startListening">🎤 Boshlash</button></div>
                <div class="translation-panel">
                    <div class="translation-text" id="userSpeech" style="font-size: 1.2rem;">...</div>
                </div>
                <div style="margin-top: 1.5rem; display: flex; gap: 10px;">
                    <input type="text" id="manualSentenceInput" placeholder="Gapni yozing..."
                        style="flex: 1; padding: 1rem; border-radius: 15px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--glass-border);">
                    <button class="btn btn-primary" id="manualAnimateBtn">🎬 Ko'rsatish</button>
                </div>
            </div>
            <div class="card">
                <div id="signOutput"></div>
            </div>
        </div>

        <div id="librarySection" style="display: none;">
            <div class="card">
                <div class="card-title">Imo-ishora lug'ati</div>
                <input type="text" id="librarySearch" placeholder="Belgini qidiring..."
                    style="width:100%; padding:1rem; border-radius:50px; margin:1rem 0; background:rgba(0,0,0,0.3); color:white;">
                <div id="libraryList"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; max-height: 400px; overflow-y: auto;">
                </div>
            </div>
        </div>

        <div id="quizSection" style="display: none;">
            <div class="translator-grid">
                <div class="card">
                    <div class="video-container"><video id="quizVideo" autoplay playsinline muted></video><canvas
                            id="quizCanvas"></canvas></div>
                    <button class="btn btn-primary" id="startQuiz" style="margin-top:1rem;">Testni boshlash</button>
                </div>
                <div class="card">
                    <div class="translation-text" id="targetSign">...</div>
                    <div id="scoreBoard">Ball: <span id="quizScore">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals & Toasts -->
    <div class="modal" id="settingsModal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;">
        <div class="card" style="width: 90%; max-width: 500px; background: #1e293b; padding: 2rem;">
            <h2 style="margin-bottom: 2rem; color: var(--primary);">Sozlamalar</h2>
            <div style="margin-bottom: 1rem;"><label>Ovoz tezligi</label><input type="range" id="speechRate" min="0.5"
                    max="2" step="0.1" value="1" style="width: 100%;"></div>
            <div style="margin-bottom: 1rem;"><label>Ovoz balandligi</label><input type="range" id="speechVolume"
                    min="0" max="1" step="0.1" value="1" style="width: 100%;"></div>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;"><label>Kamera Aks
                    (Mirror)</label><input type="checkbox" id="mirrorMode" checked></div>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;"><label>Skeletni
                    ko'rsatish</label><input type="checkbox" id="showSkeleton" checked></div>
            <div style="margin-bottom: 1rem; display: flex; justify-content: space-between;"><label>Tarixni
                    saqlash</label><input type="checkbox" id="keepHistory" checked></div>
            <button class="btn btn-primary" id="closeSettings" style="width: 100%; margin-top: 1rem;">Yopish</button>
            <button class="btn btn-outline" id="resetData"
                style="width: 100%; margin-top: 1rem; color: #ff4757; border: 1px solid #ff4757; background: transparent;">Tozalash</button>
        </div>
    </div>
    <div id="toastContainer" style="position: fixed; bottom: 20px; right: 20px; z-index: 3000;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
