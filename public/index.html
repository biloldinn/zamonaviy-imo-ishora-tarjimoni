<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Imo-ishora AI | 🤟</title>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3);
            border-color: transparent;
        }

        .translator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #videoInput,
        #outputCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .result-panel {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 1.5rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .result-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .avatar-view {
            height: 300px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            position: relative;
        }

        .voice-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 40px;
        }

        .wave-bar {
            width: 4px;
            height: 20%;
            background: var(--primary);
            border-radius: 2px;
            animation: wave 1s infinite alternate;
        }

        @keyframes wave {
            from {
                height: 20%;
            }

            to {
                height: 100%;
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .translator-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">🤟 ZAMONAVIY IMO-ISHORA AI</div>
        <div class="nav-links">
            <span id="currentTime"></span>
        </div>
    </nav>

    <div class="main-container">
        <header class="hero">
            <h1>Muloqot Chegarasiz</h1>
            <p>Imo-ishora tili va O'zbek tili o'rtasida sun'iy intellekt tarjimoni</p>
        </header>

        <div class="mode-switcher">
            <button class="mode-btn active" id="deafModeBtn">👤 Karlar Rejimi</button>
            <button class="mode-btn" id="hearingModeBtn">🗣️ Eshituvchilar Rejimi</button>
        </div>

        <main id="deafPanel" class="translator-grid">
            <div class="card">
                <div class="status-badge">
                    <span class="dot"></span> AI Kamera Faol
                </div>
                <div class="video-wrapper">
                    <video id="videoInput" autoplay playsinline muted></video>
                    <canvas id="outputCanvas"></canvas>
                </div>
                <div class="controls">
                    <button class="btn btn-start" id="startCam">KAMERANI YOQISH</button>
                    <button class="btn btn-stop" id="stopCam">TO'XTATISH</button>
                </div>
            </div>

            <div class="card">
                <h3>Tarjima va AI Javobi</h3>
                <div class="result-panel">
                    <div id="signResult" class="result-text">...</div>
                    <div id="aiResponse" style="margin-top: 1rem; color: #94a3b8;">Imo-ishora kutilmoqda</div>
                </div>
                <div id="history" style="margin-top: 2rem;">
                    <h4>So'nggi harakatlar</h4>
                    <div id="historyList" style="font-size: 0.9rem; color: #64748b; margin-top: 1rem;"></div>
                </div>
            </div>
        </main>

        <main id="hearingPanel" class="translator-grid" style="display: none;">
            <div class="card">
                <h3>Ovozli Kirish</h3>
                <div class="result-panel">
                    <div id="speechText" style="font-size: 1.2rem;">Gapirish uchun mikrofoni bosing...</div>
                    <div class="voice-wave" id="voiceWave" style="display: none; margin-top: 1rem;">
                        <div class="wave-bar"></div>
                        <div class="wave-bar" style="animation-delay: 0.1s"></div>
                        <div class="wave-bar" style="animation-delay: 0.2s"></div>
                        <div class="wave-bar" style="animation-delay: 0.3s"></div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn btn-start" id="startMic">MIKROFONNI YOQISH</button>
                    <button class="btn btn-stop" id="stopMic">TO'XTATISH</button>
                </div>
            </div>

            <div class="card">
                <h3>Imo-ishora Avatar</h3>
                <div class="avatar-view" id="avatarDisplay">🤖</div>
                <div id="signOutput"
                    style="margin-top: 1.5rem; text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--primary);">
                </div>
            </div>
        </main>
    </div>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="script.js"></script>
</body>

</html>
